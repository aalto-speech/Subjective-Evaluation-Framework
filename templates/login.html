{% extends "base.html" %}
{% set session_state_json = 'null' %}

{% block content %}
<div class="login-section">
  <h2>Listening Test</h2>

  {% if error %}
  <div class="error-message">{{ error }}</div>
  {% endif %}

  <form method="POST" action="{{ request.url_for('start') }}">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="your@email.com" autocomplete="email">
    </div>
    <button type="submit" class="submit-btn" style="width:100%">Start Test</button>
  </form>
</div>
{% endblock %}
